name: UAT health

# Scheduled runtime probe of UAT. Set repository variable UAT_ALIAS (e.g.
# `myapp-uat.vercel.app`) and, if the app exposes a DB-probing health endpoint,
# point the probe at it. A failed run notifies the repo watchers by default,
# which is the alert.
on:
  # Every 2 hours, NOT every 30 minutes: a sub-minute probe on a tight cron is
  # still a BILLED job every run (`*/30` ≈ 1,440 jobs/mo — 72% of the Free-plan
  # included minutes, the 2026-10 silent-outage root cause). `npm run
  # test:ci-policy` fails a workflow that reintroduces a sub-hourly cron.
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: uat-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe UAT health endpoint
        run: |
          set -euo pipefail
          alias="${{ vars.UAT_ALIAS }}"
          if [ -z "$alias" ]; then
            echo "::notice title=UAT health skipped::set repository variable UAT_ALIAS to probe it."
            exit 0
          fi
          url="https://${alias}/api/health?live=1"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$url")
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          test "$code" = "200"
