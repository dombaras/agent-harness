name: Merge train

# Serialized landing: at most ONE PR is merged per run, and runs never overlap
# (the `merge-train` concurrency group with cancel-in-progress:false). Each run
# re-validates the PR against the CURRENT main, so a PR that was green while main
# moved is not merged on a stale base.
#
# How a PR enters the train: apply the `merge-train` label. `npm run ship` does
# this automatically. The run fires on the label event, when a CI run completes,
# after CI pushes to main, on a schedule (the periodic drain), and by manual
# dispatch.
#
# The label name is fixed: `ship`'s `.harness.json shipLabel` override must match
# this workflow's `merge-train` label and the pick step below, or the PR never
# lands. Prefer leaving it as `merge-train`.
#
# A PR with NO CI check can never be picked (the pick step requires a non-empty
# all-green statusCheckRollup), so this workflow requires `ci.yml` to exist.
#
# Required repo settings (see docs/ci-cd-pipeline.md):
#   - Branch protection on main: require the CI checks and "branches up to date
#     before merging", and disallow direct pushes to main (where the GitHub plan
#     supports it; otherwise the local pre-push `check-push-refs` guard is the
#     floor).
#   - Secret MERGE_TRAIN_TOKEN (optional): a PAT with `repo` scope for instant
#     push-triggered draining; the default token is used when unset.
on:
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: merge-train
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write

jobs:
  land-one:
    name: Land the head of the queue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_PAT: ${{ secrets.MERGE_TRAIN_TOKEN != '' }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'merge-train'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pick the oldest green merge-train PR
        id: pick
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          n="$(
            gh pr list --state open --label merge-train --base main --limit 50 \
              --json number,mergeable,statusCheckRollup \
              --jq '
                sort_by(.number)
                | map(select(.mergeable == "MERGEABLE"))
                | map(select(
                    (.statusCheckRollup | length) > 0
                    and (.statusCheckRollup | all(
                      .conclusion == "SUCCESS" or .conclusion == "SKIPPED" or .conclusion == "NEUTRAL"
                    ))
                  ))
                | .[0].number // empty
              '
          )"
          if [ -z "$n" ]; then
            echo "No green merge-train PR to land; queue is empty or blocked."
            echo "number=" >> "$GITHUB_OUTPUT"
          else
            echo "Landing PR #$n"
            echo "number=$n" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the PR head still merges cleanly onto current main
        if: steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pick.outputs.number }}
        run: |
          set -euo pipefail
          mergeable="$(gh pr view "$PR" --json mergeable --jq .mergeable)"
          if [ "$mergeable" != "MERGEABLE" ]; then
            echo "PR #$PR is $mergeable against current main — leaving it for a later run (needs rebase)."
            exit 0
          fi

      - name: Merge (squash)
        if: steps.pick.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pick.outputs.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --squash --delete-branch \
            --subject "$(gh pr view "$PR" --json title --jq .title) (#$PR)"
          echo "Landed PR #$PR. A push to main triggers the next train run."

      - name: Validate + deploy the landed SHA on main
        if: steps.pick.outputs.number != '' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ secrets.MERGE_TRAIN_TOKEN || secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pick.outputs.number }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN squash-merge emits no push event, so dispatch the
          # downstream runs explicitly; workflow_dispatch is the one event a
          # GITHUB_TOKEN call still triggers. Pin the deploy to the exact SHA.
          sha="$(gh pr view "$PR" --json mergeCommit --jq '.mergeCommit.oid // empty')"
          if [ -z "$sha" ]; then
            echo "Could not resolve the merge commit for PR #$PR; skipping downstream dispatch." >&2
            exit 0
          fi
          gh workflow run ci.yml --ref main
          gh workflow run deploy-uat.yml --ref main -f ref="$sha"
          echo "Dispatched CI (main) + Deploy UAT ($sha) for the landed PR #$PR."
