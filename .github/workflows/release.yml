name: Release

# Tag-driven publish. `git tag v0.2.0 && git push origin v0.2.0` runs the full
# gate on the tagged commit and publishes that exact tree to npm. `auto-tag.yml`
# dispatches this workflow on `v<package.json version>` after a green main CI,
# so a version bump publishes without a manual tag.
#
# Auth: npm **trusted publishing** (OIDC, no stored token). One-time setup:
#   npm login
#   npm trust github opencode-agent-harness --repo dombaras/agent-harness \
#     --file .github/workflows/release.yml --allow-publish
# The job requests `id-token: write`; keep `NODE_AUTH_TOKEN` out of the publish
# step so npm can exchange the OIDC token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted-publishing support (pin major 11)
        # npm 12 changes `npm pack --json` output (empty array), breaking
        # test:pack below; npm 11 keeps OIDC publishing and the pack gate green.
        run: npm install -g npm@11

      - name: Verify the run is for a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Release must run on a tag ref; dispatch it with: gh workflow run release.yml --ref v<version>" >&2
            exit 1
          fi

      - name: Verify the tag matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (pkg.version !== tag) {
              console.error(`tag v${tag} != package.json ${pkg.version}`);
              process.exit(1);
            }
          '

      - run: npm run lint
      - run: npm test
      - run: npm run test:pack

      - name: Publish to npm
        run: npm publish --provenance --access public
