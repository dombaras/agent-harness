name: Auto Tag

# After a green CI run on `main`, create the `v<package.json version>` tag if it
# is missing and dispatch `release.yml` for it. A tag pushed with the workflow
# token cannot trigger another workflow, so the dispatch is explicit. Pushing a
# board-only landing (version unchanged) is a cheap no-op.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write # push the tag
  actions: write # dispatch release.yml

jobs:
  tag:
    name: Tag the landed version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Create the version tag and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists — nothing to publish"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
          echo "created $tag and dispatched Release"
